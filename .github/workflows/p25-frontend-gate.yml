name: P25 Ruflo Frontend Gate

on:
  push:
    branches:
      - feat/product-v2-p25-ask-shield
    paths:
      - scripts/p25-frontend-integrate.py
      - .github/workflows/p25-frontend-gate.yml

permissions:
  contents: write

concurrency:
  group: p25-ruflo-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/p25-frontend-integrate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit validated P25 frontend integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.jsx src/services/access/rbacService.js src/layouts/PortalLayout/navigation.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(p25): integrate Ask Shield frontend"
          git push origin HEAD:feat/product-v2-p25-ask-shield
