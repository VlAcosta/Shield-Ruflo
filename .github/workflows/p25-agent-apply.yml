name: P25 Ruflo Ask Shield Gate

on:
  push:
    branches:
      - feat/product-v2-p25-ask-shield
    paths:
      - scripts/p25-integrate.py
      - .github/workflows/p25-agent-apply.yml

permissions:
  contents: write

concurrency:
  group: p25-ruflo-ask-shield-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: business_shield
          POSTGRES_PASSWORD: business_shield_test
          POSTGRES_DB: business_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_shield -d business_shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      TEST_DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      AUTH_SECRET: ci-only-business-shield-auth-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      AUTH_OTP_PROVIDER: console
      AUTH_OTP_FIXED_CODE: ""
      AUTH_EXPOSE_DEBUG_CODE: "false"
      COMPANY_LOOKUP_PROVIDER: disabled
      INTEGRATION_CREDENTIALS_KEY: ci-only-integration-credential-key-0123456789
      PLATFORM_ADMIN_IDENTITIES: ci-platform-admin@example.test
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000
      AI_REVIEW_INTELLIGENCE_ENABLED: "false"
      AI_OPENAI_API_KEY: ""
      AI_OPENAI_MODEL: ""
      GOOGLE_BUSINESS_ENABLED: "false"
      GOOGLE_PLACES_ENABLED: "false"
      GOOGLE_PLACES_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P25 integration patch
        run: python3 scripts/p25-integrate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run prisma:generate
      - working-directory: backend
        run: npm run db:deploy
      - working-directory: backend
        run: npm run db:status
      - working-directory: backend
        run: npm run typecheck
      - working-directory: backend
        run: npm test
      - working-directory: backend
        run: npm run build
      - name: Commit validated P25 backend integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/prisma/schema.prisma backend/src/app.ts backend/src/worker.ts backend/src/modules/ai/providers/openai-review-intelligence.provider.ts
          if git diff --cached --quiet; then
            echo "No P25 integration changes"
            exit 0
          fi
          git commit -m "feat(p25): integrate Ask Shield backend"
          git push origin HEAD:feat/product-v2-p25-ask-shield
