name: P17 Quality Fix Agent

on:
  push:
    branches:
      - feat/product-v2-p17-review-ingestion

permissions:
  contents: write

concurrency:
  group: p17-quality-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-v2-p17-review-ingestion
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply confirmed P17 quality fixes
        run: node scripts/p17-quality-fix.mjs
      - name: Commit deterministic fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/integrations/review-ingestion.service.ts src/features/integrations/GoogleBusinessProfile/GoogleBusinessProfileSetup.test.jsx
          if git diff --cached --quiet; then
            echo "No P17 quality changes required"
            exit 0
          fi
          git commit -m "fix(p17): resolve quality gate findings"
          git push origin HEAD:feat/product-v2-p17-review-ingestion
