name: Refresh Business Shield lockfiles

on:
  push:
    branches:
      - feat/autonomous-p0-p12
    paths:
      - .github/workflows/refresh-lockfiles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-p0-p12
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Confirm toolchain
        run: |
          node --version
          npm --version

      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --include=dev

      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --include=dev

      - name: Verify frontend clean install
        run: npm ci

      - name: Verify backend clean install
        working-directory: backend
        run: npm ci

      - name: Commit refreshed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json backend/package-lock.json; then
            echo 'Lockfiles are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json backend/package-lock.json
          git commit -m 'chore: synchronize npm lockfiles for clean installs'
          git push origin HEAD:feat/autonomous-p0-p12
