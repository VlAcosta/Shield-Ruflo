name: P19 Agent Finalizer

on:
  workflow_run:
    workflows:
      - P19 Frontend Agent Gate
    types:
      - completed

permissions:
  contents: write

jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'feat/product-v2-p19-ai-reply-copilot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-v2-p19-ai-reply-copilot
          fetch-depth: 0
      - name: Remove temporary P19 agent infrastructure
        shell: bash
        run: |
          rm -f \
            scripts/p19-frontend-fix.py \
            .github/workflows/p19-frontend-agent.yml \
            .github/workflows/p19-frontend-diagnostics.yml \
            .github/workflows/p19-agent-finalize.yml
      - name: Commit clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- \
            scripts/p19-frontend-fix.py \
            .github/workflows/p19-frontend-agent.yml \
            .github/workflows/p19-frontend-diagnostics.yml \
            .github/workflows/p19-agent-finalize.yml || true
          if git diff --cached --quiet; then
            echo "No P19 temporary files remain"
            exit 0
          fi
          git commit -m "chore(p19): remove temporary agent validation files"
          git push origin HEAD:feat/product-v2-p19-ai-reply-copilot
