name: P14 Frontend Lockfile Sync

on:
  push:
    branches:
      - feat/product-v2-p14-frontend-modernization

permissions:
  contents: write

concurrency:
  group: p14-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-v2-p14-frontend-modernization
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Regenerate frontend lockfile from the Vite manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git commit -m "chore(p14): synchronize Vite frontend lockfile"
          git push origin HEAD:feat/product-v2-p14-frontend-modernization
