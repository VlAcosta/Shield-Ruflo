name: Notification Delivery Truth Agent

on:
  push:
    branches:
      - feat/production-ux-phase2-simplification
    paths:
      - scripts/ruflo/patch-notification-delivery-truth.mjs
      - .github/workflows/notification-delivery-truth-agent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-ux-phase2-simplification
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node scripts/ruflo/patch-notification-delivery-truth.mjs
      - name: Commit notification delivery truth
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'Business Shield Ruflo Agent'
          git config user.email '65966048+VlAcosta@users.noreply.github.com'
          git add backend/src/modules/operations/operations.routes.ts backend/test/operations-p10.integration.test.ts
          git commit -m 'notifications: fail closed for unavailable delivery channels'
          git push origin HEAD:feat/production-ux-phase2-simplification
