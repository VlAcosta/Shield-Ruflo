name: P21 Ruflo Frontend Gate

on:
  push:
    branches:
      - feat/product-v2-p21-review-acquisition
    paths:
      - scripts/p21-frontend-apply.py
      - scripts/p21-frontend-lint-fix.py
      - src/features/acquisition/**
      - src/services/acquisition/**
      - src/pages/ReviewAcquisitionLandingPage.*
      - src/pages/portal/ReviewAcquisitionPage.jsx
      - .github/workflows/p21-frontend-gate.yml

permissions:
  contents: write

concurrency:
  group: p21-ruflo-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P21 frontend integration patch
        run: |
          python3 scripts/p21-frontend-apply.py
          python3 scripts/p21-frontend-lint-fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend and QR dependency
        run: |
          npm ci
          npm install qrcode@1.5.4 --save
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Commit validated frontend integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json src/App.jsx src/layouts/PortalLayout/navigation.js src/services/access/rbacService.js src/features/acquisition/ReviewAcquisitionWorkspace.jsx
          if git diff --cached --quiet; then
            echo "No P21 frontend integration changes"
            exit 0
          fi
          git commit -m "feat(p21): integrate review acquisition frontend routes"
          git push origin HEAD:feat/product-v2-p21-review-acquisition
