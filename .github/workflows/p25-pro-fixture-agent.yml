name: P25 PRO Fixture Agent

on:
  push:
    branches:
      - feat/production-ux-phase2-simplification
    paths:
      - scripts/ruflo/patch-p25-pro-fixture.mjs
      - .github/workflows/p25-pro-fixture-agent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-ux-phase2-simplification
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node scripts/ruflo/patch-p25-pro-fixture.mjs
      - name: Commit fixture update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'Business Shield Ruflo Agent'
          git config user.email '65966048+VlAcosta@users.noreply.github.com'
          git add backend/test/p25-ask-shield.integration.test.ts
          git commit -m 'test: make Ask Shield suite an explicit PRO fixture'
          git push origin HEAD:feat/production-ux-phase2-simplification
