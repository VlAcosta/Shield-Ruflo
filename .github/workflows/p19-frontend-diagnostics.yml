name: P19 Frontend Diagnostics

on:
  push:
    branches:
      - feat/product-v2-p19-ai-reply-copilot
    paths:
      - src/**
      - .github/workflows/p19-frontend-diagnostics.yml

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Capture lint output
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee p19-frontend-lint.log
      - name: Upload lint diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: p19-frontend-lint-diagnostics
          path: p19-frontend-lint.log
          retention-days: 3
      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: exit 1
