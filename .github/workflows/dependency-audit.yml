name: Business Shield Dependency Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: business-shield-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend full-tree high/critical gate
        run: npm audit --audit-level=high
      - name: Frontend production moderate+ gate
        run: npm audit --omit=dev --audit-level=moderate

  backend-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Backend full-tree high/critical gate
        run: npm audit --audit-level=high
      - name: Backend production moderate+ gate
        run: npm audit --omit=dev --audit-level=moderate

  lockfile-refresh:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify Router remediation
        run: node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/react-router-dom']?.version !== '7.18.2' || l.packages['node_modules/react-router']?.version !== '7.18.2') process.exit(1)"
      - name: Commit generated frontend lockfile
        run: |
          git config user.name "business-shield-ci"
          git config user.email "business-shield-ci@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "security: refresh Router 7 lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
