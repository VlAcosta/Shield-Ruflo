name: Business Shield Dependency Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-shield-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend full-tree high/critical gate
        run: npm audit --audit-level=high

      - name: Frontend production moderate+ gate
        run: npm audit --omit=dev --audit-level=moderate

  backend-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Backend full-tree high/critical gate
        run: npm audit --audit-level=high

      - name: Backend production moderate+ gate
        run: npm audit --omit=dev --audit-level=moderate

  lockfile-refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Refresh frontend lockfile from the reviewed manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh backend lockfile from the reviewed manifest
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify resolved remediation versions
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/react-router-dom']?.version !== '6.30.6') process.exit(1)"
          node -e "const l=require('./backend/package-lock.json'); if(l.packages['node_modules/@fastify/swagger-ui']?.version !== '6.1.1') process.exit(1); const d=l.packages['node_modules/deepmerge-ts']?.version; if(!d || Number(d.split('.')[0]) < 8) process.exit(1)"

      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: security-remediated-lockfiles
          path: |
            package-lock.json
            backend/package-lock.json
          if-no-files-found: error
          retention-days: 1
