name: Business Shield Dependency Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: business-shield-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend full-tree high/critical gate
        run: npm audit --audit-level=high

      - name: Frontend production moderate+ gate
        run: npm audit --omit=dev --audit-level=moderate

  backend-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Backend full-tree high/critical gate
        run: npm audit --audit-level=high

      - name: Backend production moderate+ gate
        run: npm audit --omit=dev --audit-level=moderate

  lockfile-refresh:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Refresh frontend lockfile from the reviewed manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh backend lockfile from the reviewed manifest
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify resolved remediation versions
        run: |
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/react-router-dom']?.version !== '6.30.6') process.exit(1)"
          node -e "const l=require('./backend/package-lock.json'); if(l.packages['node_modules/@fastify/swagger-ui']?.version !== '6.1.1') process.exit(1); const d=l.packages['node_modules/deepmerge-ts']?.version; if(!d || Number(d.split('.')[0]) < 8) process.exit(1)"

      - name: Commit generated lockfiles to the PR branch
        run: |
          git config user.name "business-shield-ci"
          git config user.email "business-shield-ci@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match manifests"
            exit 0
          fi
          git commit -m "security: refresh remediated lockfiles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
