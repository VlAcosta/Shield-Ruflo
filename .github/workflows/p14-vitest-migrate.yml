name: P14 Vitest Migration Agent

on:
  push:
    branches:
      - feat/product-v2-p14-frontend-modernization

permissions:
  contents: write

concurrency:
  group: p14-vitest-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-v2-p14-frontend-modernization
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Apply deterministic Jest-to-Vitest codemod
        run: node scripts/p14-vitest-migrate.mjs
      - name: Commit migrated tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src
          if git diff --cached --quiet; then
            echo "No test migration changes required"
            exit 0
          fi
          git commit -m "test(p14): migrate remaining frontend Jest mocks to Vitest"
          git push origin HEAD:feat/product-v2-p14-frontend-modernization
