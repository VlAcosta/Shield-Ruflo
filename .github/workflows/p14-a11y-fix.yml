name: P14 Accessibility Fix Agent

on:
  push:
    branches:
      - feat/product-v2-p14-frontend-modernization

permissions:
  contents: write

concurrency:
  group: p14-a11y-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-v2-p14-frontend-modernization
      - name: Apply reviewed accessibility codemod
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          replace(
              'src/features/admin/clients/AdminClientDetailsWorkspace.jsx',
              '<div className="admin-client-edit" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose(); }}>',
              '<div className="admin-client-edit" role="presentation" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose(); }}>',
          )
          replace(
              'src/features/admin/clients/AdminClientDetailsWorkspace.jsx',
              '<article key={ticket.id} style={{ \'--ticket-index\': index }} role="button" tabIndex="0" onClick={() => navigate(`/admin/tickets?ticket=${ticket.id}`)} onKeyDown={(event) => { if (event.key === \'Enter\') navigate(`/admin/tickets?ticket=${ticket.id}`); }}>',
              '<button type="button" key={ticket.id} style={{ \'--ticket-index\': index }} onClick={() => navigate(`/admin/tickets?ticket=${ticket.id}`)}>',
          )
          replace(
              'src/features/admin/clients/AdminClientDetailsWorkspace.jsx',
              '</article>)}</div> : <div className="admin-client-tickets__empty">',
              '</button>)}</div> : <div className="admin-client-tickets__empty">',
          )

          replace(
              'src/features/admin/dashboard/AdminDashboardWorkspace.jsx',
              '''          <article
            key={client.id}
            className="admin-client-row"
            style={{ '--row-index': index }}
            role="button"
            tabIndex="0"
            onClick={() => onOpenClient(client.id)}
            onKeyDown={(event) => { if (event.key === 'Enter') onOpenClient(client.id); }}
          >''',
              '''          <button
            type="button"
            key={client.id}
            className="admin-client-row"
            style={{ '--row-index': index }}
            onClick={() => onOpenClient(client.id)}
          >''',
          )
          replace(
              'src/features/admin/dashboard/AdminDashboardWorkspace.jsx',
              '''            <span className="admin-list-card__arrow">›</span>
          </article>''',
              '''            <span className="admin-list-card__arrow">›</span>
          </button>''',
          )
          replace(
              'src/features/admin/dashboard/AdminDashboardWorkspace.jsx',
              '<article key={ticket.id} className="admin-ticket-row" style={{ \'--row-index\': index }} role="button" tabIndex="0" onClick={() => onOpenTicket(String(ticket.id).replace(\'#\',\'\'))} onKeyDown={(event) => { if (event.key === \'Enter\') onOpenTicket(String(ticket.id).replace(\'#\',\'\')); }}>',
              '<button type="button" key={ticket.id} className="admin-ticket-row" style={{ \'--row-index\': index }} onClick={() => onOpenTicket(String(ticket.id).replace(\'#\',\'\'))}>',
          )
          replace(
              'src/features/admin/dashboard/AdminDashboardWorkspace.jsx',
              '<Badge tone={ticket.tone === \'orange\' ? \'orange\' : \'red\'}>{ticket.status}</Badge>\n          </article>',
              '<Badge tone={ticket.tone === \'orange\' ? \'orange\' : \'red\'}>{ticket.status}</Badge>\n          </button>',
          )

          replace(
              'src/features/automations/AutomationsWorkspace.jsx',
              '<label className="automation-switch"><input type="checkbox" checked={rule.enabled} disabled={!canManage} onChange={(e)=>automations.toggle(rule.id,e.target.checked)}/><span/></label>',
              '<span className="automation-switch"><input type="checkbox" aria-label={`Включить автоматизацию ${rule.name}`} checked={rule.enabled} disabled={!canManage} onChange={(e)=>automations.toggle(rule.id,e.target.checked)}/><span aria-hidden="true"/></span>',
          )

          replace(
              'src/features/dashboard/DashboardWorkspace/DashboardWorkspace.jsx',
              '''                <label className="dashboard-workspace__catalog-item" key={id}>
                  <div>
                    <strong>{meta.title}</strong>
                    <span>{meta.description}</span>
                  </div>
                  <input
                    type="checkbox"
                    checked={config.visible}
                    onChange={(event) => setWidgetVisibility(id, event.target.checked)}
                  />
                  <i aria-hidden="true" />
                </label>''',
              '''                <div className="dashboard-workspace__catalog-item" key={id}>
                  <div>
                    <strong>{meta.title}</strong>
                    <span>{meta.description}</span>
                  </div>
                  <input
                    type="checkbox"
                    aria-label={`Показывать виджет «${meta.title}»`}
                    checked={config.visible}
                    onChange={(event) => setWidgetVisibility(id, event.target.checked)}
                  />
                  <i aria-hidden="true" />
                </div>''',
          )

          replace(
              'src/features/dashboard/Rating/Rating.jsx',
              'role="img" tabIndex="0" aria-label={`Динамика рейтинга. Текущий рейтинг ${Number(data.current).toFixed(2)}`} onMouseMove={handlePointerMove} onMouseLeave={()=>setActiveIndex(null)} onFocus={()=>setActiveIndex(points.length-1)} onBlur={()=>setActiveIndex(null)}',
              'role="img" aria-label={`Динамика рейтинга. Текущий рейтинг ${Number(data.current).toFixed(2)}`} onMouseMove={handlePointerMove} onMouseLeave={()=>setActiveIndex(null)}',
          )

          replace(
              'src/features/dashboard/ReviewsChart/ReviewsChart.jsx',
              'role="img" tabIndex="0" aria-label={`Динамика отзывов${labels[displayIndex] ? `. ${labels[displayIndex]}: ${received[displayIndex] || 0} новых отзывов` : \'\'}`} onMouseMove={handleMouseMove} onMouseLeave={() => setActiveIndex(null)} onFocus={() => setActiveIndex((current) => current ?? latestIndex)} onBlur={() => setActiveIndex(null)} onKeyDown={handleKeyDown}',
              'role="slider" tabIndex="0" aria-label="Период графика отзывов" aria-valuemin={0} aria-valuemax={latestIndex} aria-valuenow={displayIndex} aria-valuetext={`${labels[displayIndex] || \'Период\'}: ${received[displayIndex] || 0} новых отзывов, ${answered[displayIndex] || 0} ответов`} onMouseMove={handleMouseMove} onMouseLeave={() => setActiveIndex(null)} onFocus={() => setActiveIndex((current) => current ?? latestIndex)} onBlur={() => setActiveIndex(null)} onKeyDown={handleKeyDown}',
          )

          replace(
              'src/features/onboarding/OnboardingWorkspace/OnboardingWorkspace.jsx',
              '<label className="security-option">\n            <div><strong>Автоблокировка</strong><span>Блокировать кабинет при бездействии</span></div>',
              '<div className="security-option">\n            <div><strong>Автоблокировка</strong><span>Блокировать кабинет при бездействии</span></div>',
          )
          replace(
              'src/features/onboarding/OnboardingWorkspace/OnboardingWorkspace.jsx',
              '><span /></button>\n          </label>\n\n          <label className="security-select">',
              '><span /></button>\n          </div>\n\n          <label className="security-select">',
          )

          replace(
              'src/features/profile/UsersProfile/UsersProfile.jsx',
              '<span className="users-profile__member-more" onClick={(event) => { event.stopPropagation(); setMenuId((current) => current === user.id ? null : user.id); }}>',
              '<span className="users-profile__member-more" role="button" tabIndex="0" aria-label={`Действия участника ${user.name}`} onClick={(event) => { event.stopPropagation(); setMenuId((current) => current === user.id ? null : user.id); }} onKeyDown={(event) => { if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); event.stopPropagation(); setMenuId((current) => current === user.id ? null : user.id); } }}>',
          )

          replace(
              'src/features/reviews/ReviewsIntelligence/components/ReviewSettingsModal.jsx',
              '''    <label className="reviews-settings__toggleRow">
      <div><strong>{label}</strong><span>{description}</span></div>
      <input type="checkbox" checked={checked} onChange={(event) => onChange(event.target.checked)} />
      <i aria-hidden="true" />
    </label>''',
              '''    <div className="reviews-settings__toggleRow">
      <div><strong>{label}</strong><span>{description}</span></div>
      <input type="checkbox" aria-label={label} checked={checked} onChange={(event) => onChange(event.target.checked)} />
      <i aria-hidden="true" />
    </div>''',
          )

          replace(
              'src/layouts/PortalLayout/components/PortalSearch.jsx',
              '''    <div
      className="portal-command"
      role="presentation"
      onMouseDown={(event) => {
        if (event.target === event.currentTarget) onClose();
      }}
    >''',
              '''    <div
      className="portal-command"
      role="presentation"
    >''',
          )

          replace(
              'src/pages/portal/ReviewsDrawerDemo.jsx',
              '<div className="reviews-drawer-overlay" onClick={() => setDrawerOpen(false)} />',
              '<button type="button" className="reviews-drawer-overlay" aria-label="Закрыть панель отзывов" onClick={() => setDrawerOpen(false)} />',
          )

          replace(
              'src/services/profile/profileService.js',
              '''  let remote = null;
  try {
    remote = await request('/company/profile', { signal });
  } catch (error) {
    throw error;
  }''',
              '''  const remote = await request('/company/profile', { signal });''',
          )

          replace(
              'src/features/reviews/ReviewsIntelligence/components/ReviewInspector.jsx',
              '  onSaveDraft,\n',
              '',
          )
          replace(
              'src/features/reviews/ReviewsIntelligence/components/ReviewInspector.jsx',
              '  onPublishApproved,\n',
              '',
          )
          replace(
              'src/layouts/PortalLayout/components/PortalSidebar.jsx',
              'function PortalSidebar({ onLock, navigationLocked = false }) {',
              'function PortalSidebar({ navigationLocked = false }) {',
          )
          PY

      - name: Commit accessibility fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No accessibility changes required"
            exit 0
          fi
          git commit -m "fix(p14): resolve migration accessibility lint findings"
          git push origin HEAD:feat/product-v2-p14-frontend-modernization
