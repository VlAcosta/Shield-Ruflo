name: P19 Publish Reliability Gate

on:
  push:
    branches:
      - feat/product-v2-p19-ai-reply-copilot
    paths:
      - scripts/p19-publish-hardening.py
      - .github/workflows/p19-publish-hardening.yml

permissions:
  contents: write

concurrency:
  group: p19-publish-reliability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: business_shield
          POSTGRES_PASSWORD: business_shield_test
          POSTGRES_DB: business_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_shield -d business_shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      TEST_DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      AUTH_SECRET: ci-only-business-shield-auth-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      AUTH_OTP_PROVIDER: console
      AUTH_OTP_FIXED_CODE: ""
      AUTH_EXPOSE_DEBUG_CODE: "false"
      COMPANY_LOOKUP_PROVIDER: disabled
      INTEGRATION_CREDENTIALS_KEY: ci-only-integration-credential-key-0123456789
      PLATFORM_ADMIN_IDENTITIES: ci-platform-admin@example.test
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000
      AI_REVIEW_INTELLIGENCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply publish hardening
        run: python3 scripts/p19-publish-hardening.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npm run prisma:generate
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: P19 vertical slice tests
        working-directory: backend
        run: npx vitest run test/p19-ai-reply-copilot.integration.test.ts test/reviews-workflow-p5.integration.test.ts test/google-business-profile-reviews.test.ts
      - name: Backend build
        working-directory: backend
        run: npm run build
      - name: Commit validated reliability fix and remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/p19-publish-hardening.py .github/workflows/p19-publish-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/src/modules/reviews/review-replies.service.ts \
            backend/src/worker.ts \
            backend/test/p19-ai-reply-copilot.integration.test.ts
          git add -u -- scripts/p19-publish-hardening.py .github/workflows/p19-publish-hardening.yml || true
          git commit -m "fix(p19): harden provider publish retry lifecycle"
          git push origin HEAD:feat/product-v2-p19-ai-reply-copilot
