name: P22 Ruflo Frontend Gate

on:
  push:
    branches:
      - feat/product-v2-p22-competitive-intelligence
    paths:
      - scripts/p22-frontend-apply.py
      - src/features/competitive/**
      - src/services/competitive/**
      - src/pages/portal/CompetitiveIntelligencePage.jsx
      - .github/workflows/p22-frontend-gate.yml

permissions:
  contents: write

concurrency:
  group: p22-ruflo-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P22 frontend integration patch
        run: python3 scripts/p22-frontend-apply.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Commit validated frontend integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.jsx src/layouts/PortalLayout/navigation.js src/services/access/rbacService.js
          if git diff --cached --quiet; then
            echo "No P22 frontend integration changes"
            exit 0
          fi
          git commit -m "feat(p22): integrate competitive intelligence frontend routes"
          git push origin HEAD:feat/product-v2-p22-competitive-intelligence
