name: Manual Renewal Agent

on:
  push:
    branches:
      - feat/production-ux-phase2-simplification
    paths:
      - scripts/ruflo/patch-manual-renewal.mjs
      - .github/workflows/manual-renewal-agent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-ux-phase2-simplification
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - run: node scripts/ruflo/patch-manual-renewal.mjs
      - name: Commit manual renewal
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'Business Shield Ruflo Agent'
          git config user.email '65966048+VlAcosta@users.noreply.github.com'
          git add backend/src/modules/billing/billing.checkout.ts backend/test/billing-checkout.integration.test.ts src/features/subscriptions/SubscriptionsWorkspace/SubscriptionsWorkspace.jsx
          git commit -m 'billing: support safe manual plan renewal'
          git push origin HEAD:feat/production-ux-phase2-simplification
