name: P23 Ruflo Frontend Gate

on:
  push:
    branches:
      - feat/product-v2-p23-ai-visibility
    paths:
      - scripts/p23-frontend-integrate.py
      - .github/workflows/p23-frontend-gate.yml

permissions:
  contents: write

concurrency:
  group: p23-ruflo-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P23 frontend integration
        run: python3 scripts/p23-frontend-integrate.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit validated P23 frontend integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.jsx src/services/access/rbacService.js src/layouts/PortalLayout/navigation.js
          if git diff --cached --quiet; then
            echo "No P23 frontend integration changes"
            exit 0
          fi
          git commit -m "feat(p23): integrate AI visibility frontend"
          git push origin HEAD:feat/product-v2-p23-ai-visibility
