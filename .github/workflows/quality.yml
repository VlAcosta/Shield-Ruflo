name: Business Shield Quality

on:
  push:
    branches:
      - main
      - feat/autonomous-p0-p12
  pull_request:

concurrency:
  group: business-shield-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: business_shield
          POSTGRES_PASSWORD: business_shield_test
          POSTGRES_DB: business_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_shield -d business_shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      TEST_DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      AUTH_SECRET: ci-only-business-shield-auth-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      AUTH_OTP_PROVIDER: console
      AUTH_OTP_FIXED_CODE: ""
      AUTH_EXPOSE_DEBUG_CODE: "false"
      COMPANY_LOOKUP_PROVIDER: disabled
      INTEGRATION_CREDENTIALS_KEY: ci-only-integration-credential-key-0123456789
      PLATFORM_ADMIN_IDENTITIES: ci-platform-admin@example.test
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run db:deploy

      - name: Migration status
        run: npm run db:status

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify API and worker artifacts
        run: test -f dist/server.js && test -f dist/worker.js

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        env:
          CI: "true"
        run: npm run test:ci

      - name: Production build
        env:
          CI: "true"
        run: npm run build

  e2e-p0:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: business_shield
          POSTGRES_PASSWORD: business_shield_e2e
          POSTGRES_DB: business_shield_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_shield -d business_shield_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      NODE_ENV: test
      E2E_DATABASE_URL: postgresql://business_shield:business_shield_e2e@127.0.0.1:5432/business_shield_e2e
      DATABASE_URL: postgresql://business_shield:business_shield_e2e@127.0.0.1:5432/business_shield_e2e
      AUTH_SECRET: ci-only-business-shield-e2e-auth-secret-0123456789
      AUTH_COOKIE_SECURE: "false"
      AUTH_OTP_PROVIDER: console
      AUTH_OTP_FIXED_CODE: "8462"
      AUTH_EXPOSE_DEBUG_CODE: "true"
      AUTH_OTP_IP_MAX_REQUESTS: "100"
      COMPANY_LOOKUP_PROVIDER: disabled
      INTEGRATION_CREDENTIALS_KEY: ci-only-e2e-integration-credential-key-0123456789
      SWAGGER_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:3000
      E2E_FRONTEND_URL: http://127.0.0.1:3000
      E2E_BACKEND_URL: http://127.0.0.1:8081

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply isolated E2E migrations
        working-directory: backend
        run: npm run db:deploy

      - name: Install Chromium and host dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser E2E - HttpOnly session + PostgreSQL Reviews Inbox
        run: npm run test:e2e:p0

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEi '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{12,}|(api[_-]?key|password|secret)[[:space:]]*=[[:space:]]*["'"''][^"'"'']{12,})' -- ':!package-lock.json' ':!backend/package-lock.json' ':!*.md'; then
            echo 'Potential secret material found in tracked source.' >&2
            exit 1
          fi
