name: P19 Frontend Agent Gate

on:
  push:
    branches:
      - feat/product-v2-p19-ai-reply-copilot
    paths:
      - scripts/p19-frontend-fix.py
      - .github/workflows/p19-frontend-agent.yml

permissions:
  contents: write

concurrency:
  group: p19-frontend-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply P19 frontend cleanup
        run: python3 scripts/p19-frontend-fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Commit validated frontend cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/services/reviews/replyCopilotService.ts \
            src/services/reviews/reviewIntelligenceService.js \
            src/features/reviews/ReviewsIntelligence/ReviewsIntelligenceWorkspace.scss
          if git diff --cached --quiet; then
            echo "No P19 frontend cleanup changes"
            exit 0
          fi
          git commit -m "fix(p19): harden reply copilot frontend contracts"
          git push origin HEAD:feat/product-v2-p19-ai-reply-copilot
