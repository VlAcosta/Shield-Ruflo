name: P17 Queue Diagnostic Agent

on:
  push:
    branches:
      - feat/product-v2-p17-review-ingestion

permissions:
  contents: write

concurrency:
  group: p17-queue-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-v2-p17-review-ingestion
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Add queue diagnostics to P17 integration test
        run: node scripts/p17-queue-diagnostic.mjs
      - name: Commit test diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/test/review-ingestion.integration.test.ts
          if git diff --cached --quiet; then
            echo "Diagnostic already present"
            exit 0
          fi
          git commit -m "test(p17): expose sync queue failure body"
          git push origin HEAD:feat/product-v2-p17-review-ingestion
