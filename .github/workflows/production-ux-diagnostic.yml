name: Production UX Diagnostic

on:
  push:
    branches:
      - feat/production-ux-onboarding-billing-recovery
    paths:
      - '.github/workflows/production-ux-diagnostic.yml'

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: business_shield
          POSTGRES_PASSWORD: business_shield_test
          POSTGRES_DB: business_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_shield -d business_shield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      TEST_DATABASE_URL: postgresql://business_shield:business_shield_test@127.0.0.1:5432/business_shield_test
      AUTH_SECRET: ci-only-business-shield-auth-secret-0123456789
      AUTH_COOKIE_SECURE: 'false'
      AUTH_OTP_PROVIDER: console
      AUTH_OTP_FIXED_CODE: ''
      AUTH_EXPOSE_DEBUG_CODE: 'false'
      COMPANY_LOOKUP_PROVIDER: disabled
      INTEGRATION_CREDENTIALS_KEY: ci-only-integration-credential-key-0123456789
      SWAGGER_ENABLED: 'false'
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate and migrate
        working-directory: backend
        run: |
          npm run prisma:generate
          npm run db:deploy
      - name: Run focused verbose tests
        shell: bash
        run: |
          set +e
          cd backend
          npx vitest run --config vitest.config.ts \
            test/production-ux-company-registry.test.ts \
            test/production-ux-billing.integration.test.ts \
            --reporter=verbose > ../production-ux-diagnostic.log 2>&1
          code=$?
          cat ../production-ux-diagnostic.log
          exit $code
      - name: Persist failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'business-shield-ruflo-agent'
          git config user.email 'business-shield-ruflo-agent@users.noreply.github.com'
          {
            echo '# Temporary recovery QA diagnostics'
            echo
            echo '```text'
            tail -n 220 production-ux-diagnostic.log
            echo '```'
          } > production-ux-diagnostic.md
          git add production-ux-diagnostic.md
          git commit -m 'chore: capture recovery QA failure diagnostics'
          git push origin HEAD:feat/production-ux-onboarding-billing-recovery
