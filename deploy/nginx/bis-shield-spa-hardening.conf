# Include this file inside the existing Business Shield HTTPS server block.
# It intentionally does not redefine the /api proxy or TLS certificate paths.
# The parent server block should already have:
#   root /var/www/bis-shield/build;
#   include /etc/nginx/snippets/bis-shield-security-headers.conf;

# Internal API metrics are localhost-only. Do not let the SPA fallback make this
# path look public.
location = /internal/metrics {
  return 404;
}

# Never expose hidden files from the application checkout. Keep ACME validation
# reachable if certbot/webroot uses .well-known.
location ~ /.(?!well-known(?:/|$)) {
  return 404;
}

# Source/config paths are not public SPA routes.
location ~* ^/(?:backend|src|scripts|deploy)(?:/|$) {
  return 404;
}

location ~* ^/(?:package(?:-lock)?\.json|vite\.config\.(?:js|ts)|tsconfig(?:\.[^.]+)?\.json)$ {
  return 404;
}

# Vite fingerprints assets by content hash, so they are safe to cache for a
# year. Because this location defines add_header, repeat the security include
# here (nginx does not inherit parent add_header directives into such a child).
location ^~ /assets/ {
  root /var/www/bis-shield/build;
  try_files $uri =404;

  include /etc/nginx/snippets/bis-shield-security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The SPA shell must revalidate so a release cannot strand users on stale asset
# references. Normal SPA routes can continue to use the existing
# try_files $uri $uri/ /index.html rule.
location = /index.html {
  root /var/www/bis-shield/build;
  try_files /index.html =404;

  include /etc/nginx/snippets/bis-shield-security-headers.conf;
  add_header Cache-Control "no-cache" always;
}
